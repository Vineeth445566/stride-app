# Codemagic build configuration for Stride – Step Counter
# https://docs.codemagic.io/yaml-quick-start/
#
# Setup (one time):
#   1. Create a free account at https://codemagic.io
#   2. Push this repo to GitHub (see PUSH-TO-GITHUB.sh)
#   3. In Codemagic: Add application → connect the GitHub repo
#   4. Builds trigger automatically on push, or start manually.
#
# The debug APK is free to build and install directly on any Android phone.
# No signing key needed for debug builds.

workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
    scripts:
      - name: Flutter pub get
        script: |
          cd proj
          flutter pub get
      - name: Build debug APK
        script: |
          cd proj
          flutter build apk --debug
    artifacts:
      - proj/build/app/outputs/flutter-apk/app-debug.apk
